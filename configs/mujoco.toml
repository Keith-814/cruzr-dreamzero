# All frequencies, gains, cameras and gripper mapping are simulation settings.
[simulation]
model = "models/cruzr_s2/scene.xml"
physics_dt = 0.002
control_hz = 50
arm = "R"
max_joint_speed = 0.6
max_gripper_speed = 0.1
seed = 0

[robot]
# Keep the existing verified tabletop home; this is NOT a real-robot command.
home = [-1.6469613, -0.1120097, -0.4287706, -1.3961223, -0.3983825, 0.9109803, 0.5171013]
base_position = [0.0, 0.20, 0.02]
base_quaternion_wxyz = [0.70710678, 0.0, 0.0, 0.70710678]
# SDK section 1.2, printed pp.5-6 (current PDF physical pp.10-11). Matched by joint name, never ROS array index.
lower = [-2.83, -1.86, -2.92, -2.60, -2.88, -1.60, -1.98]
upper = [2.83, 0.08, 2.92, 0.02, 2.88, 1.57, 1.98]
# Simulation gains retained as starting values, NOT manufacturer gains.
kp = [4000, 6000, 4000, 4000, 4000, 4000, 4000]
kv = [90, 110, 90, 90, 90, 90, 90]
# SDK listed peak torques; force caps do not reproduce motor dynamics.
force_limit = [80, 80, 45, 45, 20, 20, 20]

[gripper]
max_width = 0.045
zero_gap = 0.0205
kp = 150
kv = 6
force_limit = 80

[task]
table_position = [0.0, 0.72, 0.70]
table_half_size = [0.50, 0.30, 0.02]
cube_position = [0.05, 0.62, 0.75]
cube_half_size = 0.015
cube_mass = 0.04
target_position = [0.15, 0.58, 0.72]
target_radius = 0.06
friction = [1.0, 0.005, 0.0001]

[task.presentation]
# World-frame starting point only; validate on the target server and replace
# with a measured pose in front of the head camera before real execution.
position = [0.05, 1.02, 1.22]
yaw = 0.0
dwell_s = 1.0

[camera]
# Efficient simulation previews. Native Pi0.5 recording sizes are 1920x1536
# (head) and 640x480 (wrist); matching pixel count alone is NOT calibration.
width = 640
height = 480
head_width = 640
head_height = 480
wrist_width = 640
wrist_height = 480
# front_cam is an EXTERNAL overview surrogate, not a calibrated robot head.
head_source = "front_cam"
wrist_source = "R_wrist_cam"
front_position = [0.0, 1.80, 1.85]
front_xyaxes = [-1.0, 0.0, 0.0, 0.0, -0.567733, 0.823213]
fovy = 60

[policy.pi05]
# Reference data contract, not a DreamZero inference configuration.
# 15 Hz samples are quantized to 33/34 physical steps at physics_dt=0.002.
sample_hz = 15
action_horizon = 50
gripper_open_target = 0.05
