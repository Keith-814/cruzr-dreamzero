[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cruzr-dreamzero"
version = "0.4.0"
description = "Cruzr S2 MuJoCo foundation for future DreamZero adaptation"
requires-python = ">=3.11,<3.13"
dependencies = ["mujoco==4.0.1", "numpy==2.2.6", "opencv-python-headless==4.11.0.86"]

[project.optional-dependencies]
data = ["pandas==2.2.3", "pyarrow==19.0.1", "tqdm==4.67.1"]
scan = ["pyzbar==0.1.9"]

[tool.setuptools.packages.find]
where = ["src"]
